    evidence: "dv/sv/sva/pmtpc4_top_sva.sv; cg_status_busy per-instance (bound once at top)"
    tests: [pmtpc4_full_test, pmtpc4_pwm_all_channels_test, pmtpc4_freeze_states_test]
    status: covered
    gap: >
      2026-09-19 FINDING (F7-verif, verification-reviewer -- see reports/coverage_waivers.md
      "Tier 2"): every existing chk() against ral.STATUS in the whole regression
      (pmtpc4_soft_reset_vseq.sv, pmtpc4_channel_vseq.sv, pmtpc4_async_reset_vseq.sv) reads
      channel 0's contribution only -- nothing had ever proven STATUS.BUSY/READY correct when
      driven by channel 1, 2, or 3, either alone or in combination. A mutation (dropping ch1/2/3
      from the OR reduction at pmtpc4.sv's hwif_in.STATUS.BUSY.next assignment) would have
      survived the entire regression undetected. RESOLVED: added a_status_busy/a_status_ready as
      CONTINUOUS properties in pmtpc4_top_sva.sv (bound once at the top level, not per-channel),
