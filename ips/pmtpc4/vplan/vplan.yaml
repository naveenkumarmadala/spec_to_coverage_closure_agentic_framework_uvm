  - id: VP-PWM-ASSERT
    feature: "Continuous white-box PWM rule: pwm_q == PWM_EN & (state != IDLE) & (COUNT >
      compare_shadow), updated only while MODULE_EN=1 and forced low by reset/soft-reset; pwm_out is
      all-zero whenever MODULE_EN=0 or PRESETn is low."
