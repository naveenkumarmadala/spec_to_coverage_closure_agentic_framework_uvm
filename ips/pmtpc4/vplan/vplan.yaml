  - id: VP-PRESC-RATIO
    feature: "The prescaler actually divides by (N+1): a channel with PERIOD=P and PRESCALER=N expires
      after (P+1)*(N+1) PCLK cycles; a mid-run PRESCALER change takes effect at the next tick boundary
      without corrupting the in-flight count (REQ-CORE-6 / SPEC-PRE-1)."
    traces_to: [REQ-CORE-6]
    method: directed
    coverage:
      kind: covergroup
      name: cg_pwm            # hosted in the same new bound module (it owns the tick accounting)
      coverpoints:
        cp_presc_at_run:      { bins: [div1, div2, mid, max] }
        cp_presc_change_run:  { bins: [changed_midrun, unchanged] }
      cross: [cp_presc_at_run, cp_presc_change_run]
    implementation: >
      Count PCLK cycles between LOAD entry and EXPIRED in the bound module and compare with
      (period+1)*(prescaler+1) in an assertion (a_presc_ratio), guarded by module_en and
      !ch_pause. Bin the observed prescaler value at RUNNING entry. The max (0xFFFF) bin is
      not simulation-practical end-to-end — cover it as "tick_en spacing == N+1 PCLK cycles"
      measured on the prescaler itself rather than a full channel expiry.
    gap: >
      NOT COVERED AND NOT CHECKED (until 2026-09-18). cg_cfg.cp_prescaler proved only
      that the value was written. No test anywhere measured the resulting tick rate,
      and no assertion related tick_en to PRESCALER_VAL, so REQ-CORE-6's divide ratio
      was unverified.
      RESOLVED 2026-09-18 (test-writer), hosted DIFFERENTLY than the plan text
      suggested: a NEW module, sva/pmtpc4_presc_sva.sv, bound ONCE at pmtpc4 top scope
      (not folded into cg_pwm / bound per-channel) -- this is a property of the ONE
      shared prescaler, not of any individual channel, and measuring the PCLK-cycle
      gap directly between consecutive tick_en pulses is both simpler than timing a
      full channel expiry and is what makes the 0xFFFF ("max") bin practical (one
      65536-cycle interval is fine; a whole channel period of that many prescaled
      ticks would not be). a_presc_ratio asserts gap==prescaler_val+1, EXCLUDING (via
      two sticky flags, both empirically necessary -- see the file's comments) any
      interval where PRESCALER_VAL changed mid-interval OR was interrupted by
      soft_reset/freeze (both legal, separately-checked cases; asserting an exact
      ratio through either would over-constrain legal behavior — a false failure from
      exactly this was found and fixed during this session's regression, triggered by
      pmtpc4_cov_close_vseq's existing SOFT_RESET pulse). cg_presc
      (cp_presc_at_run/cp_presc_change_run + x_presc) matches the vplan's bins.
      pmtpc4_prescaler_vseq/_test times a known-PERIOD one-shot expiry for
      N in {0,1,3,0x3F} (bound-checked both directions with margin once
      total_expected is comfortably large; RTL trace shows a full expiry takes
      (PERIOD+2) ticks, not (PERIOD+1) as the item's feature text estimates -- the
      vseq's own bound uses the empirically-correct figure; a_presc_ratio itself is
      unaffected either way since it checks tick spacing, not channel-level timing),
      then changes PRESCALER mid-RUNNING and checks COUNT is monotonically consistent
      (never jumps up, keeps advancing). [MUTATION-PENDING: seed the prescaler
      dividing by a fixed 1 regardless of PRESCALER_VAL and confirm a_presc_ratio fires.]
      2026-09-18 (coverage-closure): x_presc finished at 6/8; both remaining cells are
      real and are now closed by two new tasks in pmtpc4_prescaler_vseq -- neither is a
      waiver.
        (div1, changed_midrun) -- NOT reachable by simply writing PRESCALER while
          free-running at div1: with PRESCALER_VAL=0 the prescaler's cnt>=prescaler_val
          is true every cycle, so tick_en is asserted EVERY cycle and pmtpc4_presc_sva
          re-latches presc_at_interval_start (clearing presc_changed_midrun) on the very
          cycle the new value appears -- a free-running div1 interval can never observe a
          change. div1_changed_midrun() instead SUSPENDS the interval: MODULE_EN=0
          freezes the prescaler (errata 12.3) while leaving presc_at_interval_start=0
          intact, so a PRESCALER write taken during the freeze IS a genuine mid-interval
          change of a div1 interval once the module resumes. a_presc_ratio correctly
          stands down for that interval (both its presc_changed_midrun and
          presc_interrupted guards fire) -- an exact ratio does not hold across a freeze.
        (max, unchanged) -- `max` had only ever been hit as the value being changed INTO
          (0xFFFF written, then immediately lowered so a tick came quickly), i.e. always
          crossed with changed_midrun, never sustained. The cell requires the
          divide-by-65536 interval to actually elapse untouched, end to end.
          max_unchanged() does exactly that: start from div1 (tick_en every cycle, cnt
          parked at 0) so the tick on the very cycle 0xFFFF appears latches
          presc_at_interval_start=0xFFFF with changed=0, then wait the full 65536 PCLK
          cycles (655.4 us). This is a deliberate runtime cost (pmtpc4_prescaler_test
          goes from ~10s to ~4m40s wall) and it buys a real CHECK, not just a bin: it is
          the ONLY sample in the regression where a_presc_ratio evaluates the divide
          ratio at the top of PRESCALER's range (gap == 0xFFFF+1), i.e. the only
          end-to-end verification of REQ-CORE-6 at div-65536. It is also precisely the
          trade this item chose when it decided to measure tick SPACING rather than a
          channel expiry ("one interval of 65536 cycles is fine").
      cg_presc reports 100% (verified standalone on pmtpc4_prescaler_test, then in the
      union run).
    tests: [pmtpc4_full_test, pmtpc4_rand_test, pmtpc4_prescaler_test]
    status: covered

  # ======================= PWM =======================
  - id: VP-PWM-DUTY
    feature: "PWM waveform (REQ-CORE-3 / SPEC-PWM-1 / SPEC-CH-1): pwm high while COUNT > COMPARE and
      low otherwise, gated by PWM_EN, low in IDLE. COMPARE=0 => high for the entire period except at
      COUNT=0; COMPARE >= PERIOD => continuously low. Both are legal configurations."
    traces_to: [REQ-CORE-3, REQ-OUT-1]
    method: directed
    coverage:
      kind: covergroup
      name: cg_pwm
      coverpoints:
        cp_duty_class:
          bins: [period_zero, compare_zero, compare_lt_period, compare_eq_period, compare_gt_period]
        cp_pwm_en:
          bins: ["off", "on"]     # quoted: bare on/off parse as booleans in YAML 1.1
        cp_measured_duty:
          bins: "high-ticks / total-ticks over one completed period: zero_pct {0},
                 low {1-24%}, mid {25-74%}, high {75-99%}, full {100%}"
        cp_pwm_by_state:
          bins: [idle_low, load_high, load_low, run_high, run_low, paused_high, paused_low, exp_low]
      cross: [cp_duty_class, cp_pwm_en]
    implementation: >
      New bound module dv/sv/sva/pmtpc4_pwm_cov.sv, `bind pmtpc4_channel` (4 instances,
      option.per_instance = 1), same port set as the existing pmtpc4_channel_sva bind plus
      module_en/tick_en. Sampling model:
        - At LOAD entry (state IDLE->LOAD or EXPIRED->LOAD), latch per_at_load <= period and
          cmp_at_load <= compare, and reset the tick accumulators.
        - Classify duty_class from (cmp_at_load, per_at_load):
            period_zero        : per_at_load == 0
            compare_zero       : cmp_at_load == 0 && per_at_load != 0
            compare_lt_period  : 0 < cmp_at_load < per_at_load
            compare_eq_period  : cmp_at_load == per_at_load && per_at_load != 0
            compare_gt_period  : cmp_at_load > per_at_load
        - On every tick_en while module_en && state_o==S_RUN: per_ticks++, and hi_ticks++ if pwm.
        - At the RUNNING->EXPIRED edge, compute duty_pct = (hi_ticks*100)/(per_ticks) (guard
          per_ticks==0) and sample the covergroup once. cp_pwm_by_state samples every pclk.
      All bins above are reachable with the existing register set; none are auto-bins.
      Required companion CHECKERS (this is where the mutation escaped — coverage alone is
      not enough):
        a_duty_compare_zero : duty_class==compare_zero  |-> duty_pct == 100 (COUNT>0 the whole
                              period; the COUNT==0 tick is the EXPIRED entry)
        a_duty_full_low     : duty_class inside {compare_eq_period, compare_gt_period} |->
                              hi_ticks == 0
        a_duty_matches_cmp  : duty_class==compare_lt_period |-> hi_ticks ==
                              (per_at_load - cmp_at_load)   // trailing-edge PWM, exact
        a_pwm_off           : !pwm_en |-> !pwm
      Note a_duty_matches_cmp predicts from cmp_at_load, which must be latched from the
      `compare` INPUT PORT (not from the DUT's compare_shadow) — that independence is
      precisely what makes it catch the mutation that a_pwm_rule misses.
    implementation_note_2026_09_16: >
      IMPLEMENTED this session in dv/sv/sva/pmtpc4_pwm_cov.sv (bound into pmtpc4_channel x4,
      option.per_instance=1), largely as specified above, with two evidence-driven
      corrections vs. the plan text:
        (1) per_at_load/cmp_at_load are latched at the LOAD-entry DECISION cycle (state_o==
            IDLE+start_trig, or state_o==EXP+live periodic reload), not one cycle later when
            state_o is first OBSERVED as LOAD — the latter races against an in-flight
            PERIOD/COMPARE write and produced false failures under pmtpc4_cov_close_vseq's
            mid-run reconfiguration (empirically confirmed, not assumed).
        (2) hi_ticks/per_ticks are accumulated from the LIVE `count` PORT vs. cmp_at_load
            (excluding the count==0 tick, which is "the EXPIRED entry" per this item's own
            a_duty_compare_zero comment, not a duty-bearing RUN sample) rather than from the
            registered `pwm` output, because pwm's one-pclk-cycle registration lag relative
            to count interacts with PRESCALER (an artifact, not a real duty difference):
            with PRESCALER=0 the lag masks the count==0 tick's own low result (showing the
            previous nonzero tick instead); with PRESCALER>0, pwm fully settles before the
            next tick_en and shows no such lag. Sampling from `pwm` directly made the vplan's
            literal formula prescaler-dependent (confirmed via pmtpc4_toggle_vseq's
            free-running-prescaler section). The mutation-catching job that reading `pwm`
            was meant to do is now carried by a NEW, added assertion instead:
        a_pwm_matches_independent (continuous, every pclk) — mirrors the DUT's pwm_q update
            rule exactly (same technique as a_pwm_rule) but with cmp_at_load substituted for
            compare_shadow, so it is provably prescaler-independent AND still fails the
            moment compare_shadow holds the wrong value.
      Test: dv/sv/seq/pmtpc4_pwm_duty_vseq.sv + dv/sv/test/pmtpc4_pwm_duty_test.sv, run
      standalone and wired into pmtpc4_full_test. Confirmed this session: full regression
      24/24 green with these checkers active, AND a re-seeded `compare_shadow <= '0` mutation
      is caught (a_pwm_matches_independent, 2728 failures in pmtpc4_full_test) as is a
      re-seeded `count <= period + 1` mutation (a_duty_matches_cmp / a_duty_full_low, 58
      failures) — both reverted after confirmation.
    gap: >
      GENUINELY UNCOVERED — THE HEADLINE GAP. No covergroup models duty at all. cg_cfg has
      cp_compare {zero, mid, max} and cp_pwm_en {off, on}, but those are APB-write bins with
      no relation to PERIOD and no cross, so "COMPARE >= PERIOD => always low" and
      "COMPARE = 0 => always high" have no coverage point anywhere. The only PWM checker,
      sva/pmtpc4_channel_sva.sv a_pwm_rule, rebuilds its expectation from the DUT's own
      compare_shadow and is structurally blind to that register holding the wrong VALUE:
      a deliberately seeded `compare_shadow <= '0` survived a full green regression
      (reports/coverage_waivers.md). cp_measured_duty + a_duty_matches_cmp kill exactly that
      mutation — a zeroed shadow forces duty_pct to 100 (full bin) for every configuration.
      STATUS AS OF 2026-09-16: implemented and mutation-verified this session (see
      implementation_note_2026_09_16); left as `planned` pending verification-reviewer
      re-audit rather than self-certifying `covered`.
      2026-09-17 (verification-reviewer, independent re-audit): re-seeded both mutations from
      scratch, reproduced the exact failure counts, plus ran 4 additional mutations
      (count<=count-2, COUNT-not-cleared-on-disable, live-CH_MODE swap ×2, PWM_EN-gate drop)
      to prove every checker here is non-vacuous, not just compiling. Confirmed all 3 claimed
      xsim/timing bug fixes above are real (reverting each to its naive form on clean RTL
      produced spurious failures: 6497 / 19 / 127 respectively). Checking half fully verified
      trustworthy. Coverage half: cp_duty_class 5/5, cp_pwm_en 2/2, cp_measured_duty 5/5
      (non-degenerate spread), cp_pwm_by_state 8/8 with both illegal_bins at a confirmed 0 —
      but x_duty_class_pwm_en cross was only 8/10, missing {compare_eq_period,off} and
      {compare_gt_period,off}. FIXED 2026-09-17: added the two missing stimulus cases to
      pmtpc4_pwm_duty_vseq.sv (run_case(ch,P,P,0,60) and run_case(ch,P,P+1,0,60)); also gated
      a_pwm_off with module_en per a robustness note (PWM_EN written low during an
      errata-12.3 freeze would have falsely fired it — not reachable by any test today, but
      closed before someone writes one). Regression re-run surfaced a THIRD residual cross
      cell ({period_zero,off}, run-to-run stimulus-ordering dependent) — closed with one more
      stimulus case (run_case(ch,16'd0,16'd3,0,10)); x_duty_class_pwm_en now 10/10.
      A separate, real gap surfaced at cp_pwm_by_state.load_high (0 hits): proven
      STRUCTURALLY UNREACHABLE, not under-stimulated — pwm_q is registered one cycle behind
      its combinational input, and S_LOAD lasts exactly one cycle (gated by tick_en with no
      way to stall), so {state_o==S_LOAD, pwm==1} can never coincide regardless of stimulus
      (see pmtpc4_pwm_cov.sv's cp_pwm_by_state comment for the full timing argument). Moved
      to illegal_bins alongside idle_high/exp_high (same structural class); regression
      re-verified 24/24 green with zero illegal-bin violations, confirming the reasoning.
      cg_pwm: 100% (all coverpoints + the cross), independently regression-verified.
      2026-09-19 CORRECTION (Tier 2 design/verification audit, see reports/coverage_waivers.md
      "Tier 2"): the "structurally unreachable" reasoning above was wrong in its premise, not
      its timing math. It implicitly assumed pwm_level (hence pwm_q one cycle later) is gated
      by state==RUNNING||PAUSED, so LOAD could never produce a high pwm_q. design_spec.md
      SPEC-PWM-1 was itself corrected this session to `state != IDLE` (matching REQ-CORE-3's
      actual, unqualified wording) — under the corrected formula, COUNT already holds the
      just-reloaded PERIOD during LOAD, so pwm_level (and, one cycle later, pwm_q) CAN and
      SHOULD be high in LOAD whenever PERIOD > COMPARE_shadow. load_high is therefore a real,
      reachable, spec-required bin, not an illegal one. Reclassified in pmtpc4_pwm_cov.sv from
      illegal_bins to a normal bins entry; the duplicate/conflicting illegal_bins line for the
      same bin was removed. idle_high and exp_high are unaffected (still illegal_bins /
      ignore_bins respectively — see that file for their separate, still-valid reasoning).
      RE-VERIFIED 2026-09-19: full regression 40/40 green, zero raw_ERROR anywhere;
      cp_pwm_by_state now 8/8 bins covered (0 uncovered, 100%), confirming load_high fired as a
      real, positively-covered bin. See coverage_waivers.md "Tier 2 resolution" for detail.
    tests: [pmtpc4_toggle_test, pmtpc4_full_test, pmtpc4_pwm_duty_test]
    status: covered

