# PMTPC-4 verification plan. Source of truth for the SystemVerilog UVM environment.
# Each item traces to REQ/SPEC IDs; coverage closure rolls bin -> VP -> REQ.
#
# =============================================================================
# 2026-09-16 RECONCILIATION (vplan-author, after the verification-reviewer audit)
# -----------------------------------------------------------------------------
# The previous revision of this file declared 17 covergroups, of which ZERO were
# implemented under those names, and hand-marked all 25 items `status: covered`.
# It also named 29 tests that do not exist. This revision is re-derived from what
# the environment actually contains, verified file-by-file:
#   - covergroups:  cg_cfg, cg_fsm, cg_apb  (only these three exist)
#   - assertions:   sva/pmtpc4_apb_sva.sv, pmtpc4_top_sva.sv, pmtpc4_channel_sva.sv
#   - tests:        the 12 runnable *_test classes under dv/sv/test/ (see below)
# Everything else is now carried as `status: planned` with a concrete, buildable
# covergroup/bin/checker specification, NOT silently claimed.
#
# TALLY: 41 items — 19 covered, 1 waived, 21 planned (19 substantive + VP-ERRATA and
# VP-VERIF-FCOV roll-ups). Previous revision: 25 items, 25 hand-marked covered.
# Every one of the 22 REQ-* IDs in spec/requirements.md appears in >=1 traces_to
# (cross-checked mechanically against this file before handoff); every name in a
# `tests:` field resolves to a real *_test class under dv/sv/test/.
#
# STATUS CONVENTION (stricter than the bare schema, deliberately):
#   covered  = the bins named below EXIST in RTL/DV, ARE HIT in the union run
#              (reports/coverage_summary.md), AND a real checker proves the
#              behavior. `evidence:` names the file that provides each.
#   waived   = not hit, with a signed-off justification in reports/coverage_waivers.md.
#   planned  = the coverage model and/or the checker does not exist yet. This
#              INCLUDES items whose stimulus runs today but whose behavior nothing
#              checks (`gap:` says which of the two is missing). Bins-hit-but-
#              unchecked is NOT "covered" in this plan.
#   closed   = deliberately unused until DV sign-off is released; the 2026-09-15
#              mutation-testing pass is still holding it.
#
# TESTS: `tests:` names only UVM test classes that exist today (full class names,
# as discovered by flow/scripts/run_regression.py). Work that still needs a new
# test/sequence is listed under `tests_needed:` and is test-writer's scope, not
# this plan's. Existing tests:
#   pmtpc4_sanity_test  pmtpc4_channel_test  pmtpc4_irq_test  pmtpc4_toggle_test
#   pmtpc4_rand_test    pmtpc4_full_test     pmtpc4_reg_reset_test
#   pmtpc4_reg_rw_test  pmtpc4_reg_ro_test   pmtpc4_reg_wo_test
#   pmtpc4_reg_reserved_test                 pmtpc4_reg_unaligned_test
# NOTE: only pmtpc4_full_test runs pmtpc4_cov_close_vseq / _toggle_vseq / _rand_vseq,
# so it is the only test that closes cg_fsm on channels 1-3 and sweeps cg_cfg.
# =============================================================================

ip: pmtpc4
coverage_goal_pct: 100

# ---------------------------------------------------------------------------
# Covergroup inventory — the authoritative name<->file map. If a covergroup is
# not in this list it does not exist; do not reference it from an item.
# ---------------------------------------------------------------------------
covergroup_inventory:
  implemented:
    - name: cg_cfg
      file: dv/sv/env/pmtpc4_coverage.sv
      sampled_on: "every APB transaction (uvm_subscriber #(apb_item))"
      coverpoints: [cp_prescaler, cp_period, cp_compare, cp_mode, cp_pwm_en,
                    cp_pause, cp_gie, cp_inten, cp_moduleen]
      crosses: []
      note: >
        Models PROGRAMMED CONFIGURATION VALUES only (what was written over APB),
        never observed DUT behavior, and merges all four channels (its is_ch()
        guard matches any channel offset). Do not read a cg_cfg bin as evidence
        that the corresponding behavior happened.
    - name: cg_fsm
      file: "dv/sv/sva/pmtpc4_channel_sva.sv (bound into pmtpc4_channel, x4 instances)"
      sampled_on: "@(posedge pclk)"
      coverpoints: [cp_state, cp_trans, cp_frozen_state, cp_mode_at_expiry, cp_mode_changed_run]
      crosses: [x_mode_live]
      note: >
        UPDATED 2026-09-16/17: `option.per_instance = 1` was added this session (was
        previously NOT set, merging ch0-ch3's type score — see history below if that
        note resurfaces from an older copy). cp_frozen_state/cp_mode_at_expiry/
        cp_mode_changed_run/x_mode_live added for VP-FREEZE-STATES/VP-CH-MODE-LIVE.
        cp_frozen_state and x_mode_live are genuinely thin (2/5, 2/4 resp. on ch0;
        worse on ch1-3) per the 2026-09-17 verification-reviewer audit — real
        stimulus gaps, not vacuous checkers.
    - name: cg_apb
      file: "../../vip/apb/sv/apb_coverage.sv"
      sampled_on: "every APB transaction (uvm_subscriber #(apb_item))"
      coverpoints: [cp_rw, cp_err, cp_wait, cp_addr, cp_cause]
      crosses: [x_rw_err, x_cause, x_wait_err]
      note: >
        2026-09-18 (test-writer): cp_cause (a dedicated, narrow reserved/unaligned/
        ro_write/legal classification, deliberately NOT crossed with the full
        per-register cp_addr, to keep the denominator small) + x_cause added for
        VP-APB-ERR-CAUSE; x_wait_err (with the errata-12.4 ignore_bin) added for
        VP-APB-WAIT-ERR. Both close on EXISTING stimulus (reg_reserved/reg_ro/
        reg_unaligned vseqs) -- no new test needed for either.
    - name: cg_pwm
      file: "dv/sv/sva/pmtpc4_pwm_cov.sv (bound into pmtpc4_channel, x4 instances)"
      sampled_on: "@(posedge pclk), plus once per RUNNING->EXPIRED edge for the duty coverpoints"
      coverpoints: [cp_duty_class, cp_pwm_en, cp_measured_duty, cp_pwm_by_state,
                    cp_period_at_load, cp_expired_after, cp_cmp_write_timing, cp_per_write_timing]
      crosses: [x_duty_class_pwm_en, x_period0, x_cmp_write_duty]
      note: >
        IMPLEMENTED 2026-09-16, independently mutation-verified 2026-09-17. Moved here
        from `proposed` below. See VP-PWM-DUTY, VP-PWM-SHADOW-VALUE/-DEFER,
        VP-CH-PAUSE-PWM for status/gaps on the individual items this covergroup backs.
        `option.per_instance = 1` is set. IMPORTANT: gen_exclusions.py must be re-run
        whenever pmtpc4_pwm_cov.sv (testbench code) is added/changed, or it leaks into
        the DUT-scoped code-coverage denominator (this happened once, 2026-09-16->17,
        inflating statement/branch/toggle and deflating condition — see
        reports/coverage_waivers.md). A SECOND instance of the same class of bug was found
        and fixed 2026-09-18 (tb-architect): xsim elaborates each interface CLOCKING BLOCK as
        its own module, and gen_exclusions.py's regex only matched module|package|interface,
        not clocking — so vip/apb's drv_cb/mon_cb clocking blocks had been sitting in the DUT
        toggle denominator all along, understating the true score. Fixed generically (the
        regex now matches clocking too, not a pmtpc4-specific patch); toggle moved
        38.6% -> 44.11% as a measurement-accuracy correction, not a stimulus change.
        A THIRD instance was found 2026-09-19 (verification-reviewer): pmtpc4_top_sva (a
        MODULE, not an interface, but containing generate blocks) also elaborates under a
        "_default" variant name, so its exact-name exclusion silently stopped matching and
        testbench SVA code was scored into the DUT denominator. gen_exclusions.py's fix this
        time was made unconditional (every non-DUT name is now wildcarded, not just
        interfaces) rather than special-cased a third time -- see the script's own comment.
        cp_period_at_load/cp_expired_after/x_period0 (VP-CH-PERIOD0) and
        cp_cmp_write_timing/cp_per_write_timing/x_cmp_write_duty (VP-PWM-SHADOW-DEFER) added
        2026-09-18/19 to this SAME covergroup (not new ones) — this list previously omitted
        them, which is a traceability bug this line fixes, not a re-implementation.
    - name: cg_pwm_out
      file: "vip/pwm/sv/pwm_monitor.sv (generic passive UVC monitor) + dv/sv/env/pmtpc4_pwm_coverage.sv
        (IP-specific coverage subscriber -- cp_pin bin names are pmtpc4-specific and must not
        live in the reusable UVC)"
      sampled_on: "pwm_item transactions (PWM_RISE/PWM_FALL/PWM_WINDOW/PWM_RESET) via env.pwm_agt.mon.ap"
      coverpoints: [cp_pin, cp_level, cp_activity]
      crosses: [x_pin_level]
      note: >
        IMPLEMENTED 2026-09-18 (tb-architect), scores 100%. This is coverage/observation
        plumbing; the CHECKER (pmtpc4_pwm_blackbox_checker.sv, fed from the RAL mirror,
        never a DUT-internal signal) was added the same day by test-writer -- see
        VP-PWM-BLACKBOX for its scope (gating only; the exact duty value and the
        COMPARE>=PERIOD case are NOT checked black-box, honestly, and remain
        VP-PWM-DUTY's white-box job).
    - name: cg_apb_fsm
      file: "../../vip/apb/sv/apb_fsm_cov.sv (new bound module, NOT folded into apb_coverage.sv --
        apb_coverage.sv is a uvm_subscriber fed one item per COMPLETED transfer and structurally
        cannot see bus phases; VP-APB-FSM-B2B's own implementation text explicitly allows a
        small bound module for exactly this reason)"
      sampled_on: "@(posedge pclk), bound into the APB interface"
      coverpoints: [cp_state, cp_trans]
      crosses: []
      note: >
        IMPLEMENTED 2026-09-18 (tb-architect) alongside the opt-in back-to-back driver mode
        it measures. Was 87.5% (cp_trans.access_setup_b2b unreachable -- no driver mode could
        produce it) until test-writer added pmtpc4_apb_b2b_vseq/_test the same day, which
        drives a real back-to-back burst via apb_b2b_seq/raw_b2b() and closes the bin.
    - name: cg_fsm
      file: "dv/sv/sva/pmtpc4_channel_sva.sv (bound into pmtpc4_channel, x4 instances)"
      note: >
        2026-09-18 (test-writer): no NEW bins added here (cp_frozen_state/
        cp_mode_changed_run already existed, see the cg_fsm entry above) -- what
        closed VP-CH-MODE-LIVE/VP-FREEZE-STATES was STIMULUS
        (pmtpc4_mode_live_vseq/_test, pmtpc4_freeze_states_vseq/_test), not a
        coverage-model change. Listed here again only to avoid a reader concluding
        those two items needed a second covergroup.
    - name: cg_int
      file: "dv/sv/sva/pmtpc4_top_sva.sv (folded in, not a separate file -- it already had
        global_ie/int_status_val/int_en_val/global_int_status/irq as ports; ch_expiry[4] +
        cpuif_req/cpuif_req_is_wr/cpuif_addr/cpuif_wr_data added for VP-INT-SETPRI/-W1C at
        the same time)"
      sampled_on: "@(posedge pclk)"
      coverpoints: [cp_global_ie, cp_any_enabled_status, cp_masked_but_latched, cp_irq,
                    cp_n_simultaneous]
      crosses: [x_mask]
      note: >
        IMPLEMENTED 2026-09-18 (test-writer) for VP-INT-MASK-CROSS/VP-INT-SIMUL. A
        SEPARATE per-channel-bit covergroup, cg_int_bit (cp_op: set_by_hw/clr_by_w1/
        hold_on_w0/already_set_set_again, option.per_instance standing in for the
        vplan's cp_bit x cp_op cross), was added alongside it in the same file for
        VP-INT-W1C.
    - name: cg_reset
      file: "dv/sv/sva/pmtpc4_top_sva.sv (folded in, sampled @(negedge presetn) -- NOT a
        separate pmtpc4_reset_coverage.sv file; ch_state0-3/psel/penable added as new
        ports on the bind)"
      sampled_on: "@(negedge presetn) -- the one instant that matters, and genuinely
        asynchronous, so a pclk-edge-sampled covergroup would miss an async_delay!=0
        assertion landing off the clock edge"
      coverpoints: [cp_state_at_reset, cp_apb_at_reset]
      crosses: [x_reset]
      note: >
        IMPLEMENTED 2026-09-18 (test-writer) for VP-RST-ASYNC. cp_state_at_reset picks
        whichever channel is non-IDLE (priority ch0>ch1>ch2>ch3) at the reset instant --
        exact for this session's stimulus (always exactly one channel active per
        scenario), not a general 4-channel-simultaneous model.
        cg_selfclr (cp_selfclr_bit x cp_read_latency, VP-SELFCLR) and cp_soft_cleared_*
        (3 boolean coverpoints, VP-RST-SOFT) are TRANSACTION-level instead (added to
        dv/sv/env/pmtpc4_coverage.sv, not this cg_reset) -- see those items' own gap
        notes for why, and for the two VP-RST-SOFT coverpoints (cp_soft_preserved,
        cp_soft_during) that were NOT built.
    - name: cg_presc
      file: "dv/sv/sva/pmtpc4_presc_sva.sv (new, bound ONCE at pmtpc4 top scope -- not
        per-channel; this is a property of the single shared prescaler)"
      sampled_on: "@(posedge pclk)"
      coverpoints: [cp_presc_at_run, cp_presc_change_run]
      crosses: [x_presc]
      note: >
        IMPLEMENTED 2026-09-18 (test-writer) for VP-PRESC-RATIO, alongside
        a_presc_ratio. Measures the PCLK-cycle gap between consecutive tick_en pulses
        directly (not via a full channel expiry), which is what makes the 0xFFFF
        ("max") bin practical -- one interval of 65536 cycles is fine; a whole channel
        period of that many prescaled ticks would not be.

items:
  # ======================= Register / RAL =======================
  - id: VP-REG-RESET
    feature: "Every register/field reads its reset value after PRESETn (power-on)."
    traces_to: [REQ-RST-1]
    method: register
    coverage: { kind: ral, ral_sequences: [reset] }
    checker: "uvm_reg_hw_reset_seq (RAL-derived, every field)"
    evidence: "dv/sv/seq/pmtpc4_reg_vseq.sv::pmtpc4_reg_reset_vseq"
    tests: [pmtpc4_reg_reset_test, pmtpc4_full_test]
    status: covered

  - id: VP-REG-ACCESS
    feature: "R/W access policy for every register: writable bits proven by bit-bash; RO / reserved /
      unaligned offsets reject with PSLVERR via the RAL-derived error suite. (uvm_reg_access_seq
      front/back-door is out of scope until a back-door hdl_path is generated; front-door policy is
      fully covered by bit_bash + the reg-error vseqs.)"
    traces_to: [REQ-APB-1, REQ-APB-2]
    method: register
    coverage: { kind: ral, ral_sequences: [bit_bash] }
    checker: "uvm_reg_bit_bash_seq (fully-RO regs excluded, see pmtpc4_reg_rw_vseq) + pmtpc4_scoreboard readback shadow"
    evidence: "dv/sv/seq/pmtpc4_reg_vseq.sv, dv/sv/seq/pmtpc4_error_vseq.sv, dv/sv/env/pmtpc4_scoreboard.sv"
    tests: [pmtpc4_reg_rw_test, pmtpc4_reg_ro_test, pmtpc4_reg_wo_test,
            pmtpc4_reg_reserved_test, pmtpc4_reg_unaligned_test, pmtpc4_full_test]
    status: covered
    gap: >
      RESOLVED 2026-09-18 (test-writer): readmask()/selfclear_mask() now enforce
      CTRL.SOFT_RESET / CHx_CTRL.CH_START readback (forced to 0) on every access, not
      just bit-bash -- see VP-SELFCLR. CH_EN remains excluded from the static shadow
      (it is genuinely hw-cleared on one-shot expiry, not statically predictable from
      write history alone); its dynamics are checked by the directed channel vseqs +
      RAL, unchanged from before.

  # ======================= APB protocol / errors =======================
  - id: VP-APB-XFER
    feature: "APB3 transfers over the whole decoded map: every register offset accessed for read and
      write, legal accesses complete with PSLVERR=0."
    traces_to: [REQ-APB-1]
    method: constrained-random
    coverage:
      kind: covergroup
      name: cg_apb
      coverpoints:
        cp_rw:   { bins: [rd, wr] }
        cp_err:  { bins: [ok, err] }
        cp_addr: { bins: "named per-register bins: ctrl, status, gie, gisr, presc, clksel,
                          ch_ctrl[4], ch_period[4], ch_cmp[4], ch_count[4], intstat, inten,
                          reserved[6], unaligned" }
      cross: [cp_rw, cp_err]
    checker: "pmtpc4_scoreboard (PSLVERR legality, wait count, PRDATA=0 on error, RW readback shadow)
      + sva/pmtpc4_apb_sva.sv a_err_matches_decode / a_slverr_with_ready / a_stable_during_wait"
    evidence: "reports/coverage_summary.md: cg_apb 100% net of one waived bin"
    tests: [pmtpc4_full_test, pmtpc4_rand_test, pmtpc4_reg_rw_test, pmtpc4_sanity_test]
    status: covered

  - id: VP-APB-FSM-B2B
    feature: "APB slave FSM IDLE/SETUP/ACCESS states and legal edges, INCLUDING back-to-back
      (ACCESS->SETUP with PSEL held high), per Design 8 / SPEC-APB-1."
    traces_to: [REQ-APB-1]
    method: constrained-random
    coverage:
      kind: covergroup
      name: cg_apb_fsm
      coverpoints:
        cp_state: { bins: [IDLE, SETUP, ACCESS] }
        cp_trans: { bins: [idle_setup, setup_access, access_setup_b2b, access_idle] }
    implementation: >
      Add to vip/apb/sv/apb_coverage.sv a second, clock-sampled covergroup (or a small
      bound module on apb_if) reconstructing the completer-side FSM from
      {psel, penable, pready}: IDLE = !psel; SETUP = psel & !penable;
      ACCESS = psel & penable. cp_trans is a transition coverpoint on that 2-bit
      state. access_setup_b2b requires PSEL to stay asserted across the boundary.
    gap: >
      RESOLVED 2026-09-18 (tb-architect): vip/apb now has an opt-in back-to-back driver
      mode (apb_agent_cfg.b2b_enable + apb_item.back_to_back) built exactly for this,
      plus apb_fsm_cov measuring cp_trans including access_setup_b2b. That closed the
      STRUCTURAL half; the STIMULUS half (something actually driving a b2b burst) was
      still open at that point.
      CLOSED 2026-09-18 (test-writer): pmtpc4_apb_b2b_vseq/_test drives a 5-item mixed
      read/write burst via raw_b2b() with PSEL held across every ACCESS->SETUP
      boundary. cg_apb_fsm.cp_trans.access_setup_b2b now hits (verified: 24/25 runs
      green pre-existing regression + this new test green standalone and inside
      pmtpc4_full_test). REQ-APB-1's back-to-back clause is now exercised and checked
      (scoreboard PSLVERR/wait/readback rules apply unchanged to a chained item).
    tests: [pmtpc4_rand_test, pmtpc4_full_test, pmtpc4_apb_b2b_test]
    status: covered

  - id: VP-APB-ERR
    feature: "PSLVERR=1 with PRDATA=0 and zero wait states on reserved regions (0x18-0x1C, 0x68-0x6C,
      0x70-0xFF), RO-register writes (STATUS / GLOBAL_ISR / CHx_COUNT) and unaligned PADDR[1:0]!=0."
    traces_to: [REQ-APB-2]
    method: directed
    coverage:
      kind: covergroup
      name: cg_apb
      coverpoints:
        cp_addr: { bins: "reserved[6] = {0x18,0x1C,0x68,0x6C,0x70,0xFC}; unaligned = PADDR[1:0]!=0;
                          status/gisr/ch_count[4] (the RO-write targets)" }
        cp_err:  { bins: [ok, err] }
      cross: [cp_rw, cp_err]
    checker: "pmtpc4_scoreboard.exp_err() per access + sva a_err_matches_decode (continuous, every
      completed access) + explicit chk() in the reg_* error vseqs"
    evidence: "pmtpc4_reg_reserved_vseq sweeps EVERY unoccupied 4-byte offset in 0x00-0xFF for both
      read and write; pmtpc4_reg_ro_vseq derives RO targets from the RAL"
    tests: [pmtpc4_reg_reserved_test, pmtpc4_reg_ro_test, pmtpc4_reg_unaligned_test,
            pmtpc4_rand_test, pmtpc4_full_test]
    status: covered

  - id: VP-APB-ERR-CAUSE
    feature: "Each distinct error CAUSE class is proven in BOTH directions (read and write), not just
      in aggregate: reserved x {rd,wr}, RO-write, unaligned x {rd,wr}."
    traces_to: [REQ-APB-2]
    method: directed
    coverage:
      kind: covergroup
      name: cg_apb
      coverpoints:
        cp_addr: { bins: "existing named bins" }
        cp_rw:   { bins: [rd, wr] }
        cp_err:  { bins: [ok, err] }
      cross: [cp_addr, cp_rw, cp_err]
    implementation: >
      Add `x_cause: cross cp_addr, cp_rw, cp_err { ignore_bins legal = binsof(cp_err.ok); }`
      to vip/apb/sv/apb_coverage.sv, plus ignore_bins for the combinations that cannot
      error (e.g. a legal RW register read). Keep the cross narrow so it does not
      explode the denominator: only the reserved[], unaligned and RO bins participate.
    gap: >
      RESOLVED 2026-09-18 (test-writer). Added a dedicated, narrow cp_cause coverpoint
      (classify_cause()) to vip/apb/sv/apb_coverage.sv, distinct from cp_addr's
      per-register granularity, plus x_cause: cross cp_cause, cp_rw, cp_err with
      ignore_bins removing every "legal" and structurally-impossible cell. Exactly the
      5 real cells survive: reserved x {rd,wr}, unaligned x {rd,wr}, ro_write x wr
      (ro_write x rd is impossible by construction -- reading an RO register is legal,
      not an error cause -- and is ignore_bins'd out). All 5 are hit by the existing
      reg_reserved/reg_ro/reg_unaligned vseqs; no new stimulus was needed, only the
      coverage resolution the item asked for.
    tests: [pmtpc4_reg_reserved_test, pmtpc4_reg_ro_test, pmtpc4_reg_unaligned_test, pmtpc4_full_test]
    status: covered

  - id: VP-APB-WAIT
    feature: "CHx_COUNT read inserts exactly one wait state; every other legal access is zero-wait."
    traces_to: [REQ-APB-3]
    method: directed
    coverage:
      kind: covergroup
      name: cg_apb
      coverpoints:
        cp_wait: { bins: [zero, one, many] }
        cp_addr: { bins: "ch_count[4]" }
    checker: "pmtpc4_scoreboard.exp_waits() on every access + explicit waits==1 check in
      pmtpc4_smoke_vseq (CH0_COUNT) + waits==0 checks in the reg-error vseqs"
    evidence: "reports/coverage_summary.md: cp_wait.zero/one hit"
    waivers:
      - bin: cg_apb.cp_wait.many
        reason: "Unreachable by design: the PMTPC-4 completer inserts at most one wait state
          (REQ-APB-3 / errata 12.4). Bin lives in the reusable APB VIP. Signed off in
          reports/coverage_waivers.md."
    tests: [pmtpc4_sanity_test, pmtpc4_rand_test, pmtpc4_full_test]
    status: covered

  - id: VP-APB-WAIT-ERR
    feature: "Errata 12.4: an ERRORED access never inserts a wait state — distinguished in coverage
      from a legal zero-wait access."
    traces_to: [REQ-APB-3]
    method: directed
    coverage:
      kind: covergroup
      name: cg_apb
      coverpoints:
        cp_wait: { bins: [zero, one] }
        cp_err:  { bins: [ok, err] }
      cross: [cp_wait, cp_err]
    implementation: >
      Add `x_wait_err: cross cp_wait, cp_err { ignore_bins err_waited = binsof(cp_err.err) &&
      binsof(cp_wait.one); }` — the ignore_bin is itself the errata-12.4 statement, and the
      two remaining bins are exactly `normal_0ws` (ok,zero) / `count_rd_1ws` (ok,one) /
      `err_0ws` (err,zero).
    gap: >
      RESOLVED 2026-09-18 (test-writer). Added x_wait_err: cross cp_wait, cp_err to
      vip/apb/sv/apb_coverage.sv with `ignore_bins err_waited = binsof(cp_err.err) &&
      binsof(cp_wait.one)` — the ignore_bin IS the errata-12.4 statement, exactly as
      specified. The 3 surviving cells (normal_0ws, count_rd_1ws, err_0ws) are all hit
      by the existing regression (legal zero-wait accesses, CHx_COUNT reads, and
      reserved/RO/unaligned errors are all already exercised). No new stimulus needed.
    tests: [pmtpc4_reg_reserved_test, pmtpc4_reg_ro_test, pmtpc4_full_test]
    status: covered

  # ======================= Channel core FSM =======================
  - id: VP-CH-FSM
    feature: "Per-channel FSM states and every edge of the Design 7.3 / SPEC-CH-1 transition table."
    traces_to: [REQ-CORE-1, REQ-CORE-2, REQ-CORE-5]
    method: constrained-random
