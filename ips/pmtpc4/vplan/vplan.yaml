  # ======================= Reset & module-enable =======================
  - id: VP-RST-POR
    feature: "Power-on PRESETn: all registers at reset values, all FSMs IDLE, pwm_out low, irq low."
    traces_to: [REQ-RST-1]
    method: directed
    coverage: { kind: assertion, name: a_reset_outputs_low }
    checker: "sva/pmtpc4_top_sva.sv a_reset_outputs_low (!presetn |-> pwm_out==0 && irq==0) +
      uvm_reg_hw_reset_seq over every field + sva a_valid_state"
    evidence: "dv/sv/tb/pmtpc4_tb_top.sv holds presetn low for 5 clocks at time 0"
    tests: [pmtpc4_reg_reset_test, pmtpc4_full_test]
    status: covered

  - id: VP-RST-ASYNC
    feature: "Async PRESETn asserted FROM ANY RUNNING STATE (RUNNING / PAUSED / EXPIRED / mid-APB
      transfer) returns all registers to reset, all FSMs to IDLE, pwm_out low, irq low (REQ-RST-1)."
    traces_to: [REQ-RST-1]
    method: directed
    coverage:
      kind: covergroup
      name: cg_reset
      coverpoints:
        cp_state_at_reset: { bins: [idle, load, running, paused, expired] }
        cp_apb_at_reset:   { bins: [bus_idle, mid_setup, mid_access] }
      cross: [cp_state_at_reset, cp_apb_at_reset]
    implementation: >
      A reset covergroup sampled on the falling edge of presetn (in pmtpc4_top_sva.sv, or a
      small bound module with access to a channel's state_o and the APB psel/penable), plus
      an assertion that all four channel states are IDLE and all registers read their reset
      values after the release. Requires a TB reset-driver task (see tests_needed).
    gap: >
      NOT COVERED. dv/sv/tb/pmtpc4_tb_top.sv drives presetn exactly ONCE, in an initial block
      at time 0, and never again — no test can assert reset mid-simulation, so only the
      power-on (bus-idle, all-IDLE) case is ever seen. REQ-RST-1's "from any state" clause is
      unverified, and a reset that failed to clear a running counter would not be detected.
      RESOLVED IN TWO STEPS 2026-09-18. tb-architect built the TB-level infrastructure:
      vip/common/sv/reset_if.sv (apply/assert_reset/release_reset + assert_count/
      release_count/events) replacing tb_top's bare power-on `initial` block, plus
      pmtpc4_base_vseq wrappers (async_reset()/reset_assert()/reset_release()) and
      handle_reset() re-sync hooks on pmtpc4_scoreboard/pmtpc4_env -- confirmed working
      on the 24/24 regression, but nothing yet CALLED it. test-writer then added the
      coverage model (cg_reset: cp_state_at_reset/cp_apb_at_reset + x_reset, sampled on
      @(negedge presetn) in sva/pmtpc4_top_sva.sv, fed from new ch_state0-3/psel/penable
      ports on the bind) and the stimulus: pmtpc4_async_reset_vseq/_test pulses PRESETn
      from RUNNING, from PAUSED (via errata-12.1 LOAD->PAUSED), from EXPIRED (one-shot),
      and mid-APB-ACCESS (async_delay!=0, forked against an in-flight raw read), checking
      every channel's CH_CTRL/STATUS reads 0 immediately after each pulse and re-running
      uvm_reg_hw_reset_seq for the full RAL-derived sweep. [MUTATION-PENDING: seed a
      channel's state register NOT resetting on presetn and confirm the vseq's direct
      chk() and/or uvm_reg_hw_reset_seq catch it.]
      2026-09-18 (coverage-closure): cg_reset finished at 60% -- cp_state_at_reset.expired
      = 0, cp_apb_at_reset.mid_setup = 0, and x_reset at 5/15. Both single-coverpoint
      holes were TIMING, not missing scenarios:
        expired -- the "from EXPIRED" case used a one-shot at PRESCALER=0, where EXPIRED
          lasts exactly ONE PCLK cycle and self-clears to IDLE long before a cyc(20)
          wait returns. Replaced with a PERIODIC channel at PRESCALER=63 (a 64-cycle
          EXPIRED window) plus a poll of INT_STATUS, which pins the reset to ~15 cycles
          after EXPIRED is ENTERED instead of guessing.
        mid_setup -- the APB SETUP phase is exactly one PCLK cycle wide and nothing aimed
          at it.
      x_reset is a genuine TWO-AXIS coincidence (a channel in an exact FSM state AND the
      bus in an exact phase at the same instant), so it is closed by a SWEEP, not one
      offset: sweep_all_states_vs_apb_phase() re-arms channel 0 into each of the five
      states and fires async_reset(4, 3ns) at PCLK offsets 0..5 into a background stream
      of ordinary (non-chained) APB reads, which cycles the bus IDLE -> SETUP -> ACCESS
      with a 3-cycle period -- so every residue of that pattern is covered several times
      over for every state. The LOAD state is made deterministic the same way
      pmtpc4_freeze_states_vseq does it (a SOFT_RESET pulse zeroes the shared prescaler's
      own counter, so the tick that ends S_LOAD is a known LOAD_PRESC+1 cycles away
      rather than at an arbitrary phase). Every one of those 30 resets is CHECKED, with
      REQ-RST-1's own claim: all four CH_CTRL and STATUS read 0 afterwards
      (light_reset_check). The heavier full-RAL uvm_reg_hw_reset_seq sweep stays on the
      original scenarios -- repeating its ~112 reads 30 more times would buy nothing.
      Verified standalone: cg_reset 100%, all 15 x_reset cells hit, 0 UVM_ERROR/SVA.
    tests: [pmtpc4_full_test, pmtpc4_async_reset_test]
    status: covered

  - id: VP-RST-SOFT
    feature: "CTRL.SOFT_RESET clears the channel cores and interrupt state (COUNT, FSM, INT_STATUS)
      but PRESERVES PRESCALER / CLK_SEL / the APB FSM, and does not disturb an in-flight APB transfer
      (REQ-RST-2 / Design 9)."
    traces_to: [REQ-RST-2]
    method: directed
    coverage:
      kind: covergroup
      name: cg_reset
      coverpoints:
        cp_soft_preserved: { bins: [prescaler_nonzero, clk_sel_set] }
        cp_soft_cleared:   { bins: [count_nonzero, int_status_nonzero, fsm_non_idle] }
        cp_soft_during:    { bins: [bus_idle, mid_apb_transfer] }
      cross: [cp_soft_cleared, cp_soft_during]
    implementation: >
      Sample on the soft_reset pulse. The precondition bins (nonzero PRESCALER, nonzero COUNT,
      set INT_STATUS, non-IDLE FSM) are what make the observation meaningful — a soft reset
      applied to an already-idle, already-zero device proves nothing, and those preconditions
      must be in the coverage model so a vacuous run cannot claim the bin.
    gap: >
      NOT COVERED AND NOT CHECKED. pmtpc4_cov_close_vseq::rtl_corners() writes CTRL with
      SOFT_RESET=1 purely to reach the soft_reset branches for code coverage; it makes no
      check whatsoever afterwards, and it immediately overwrites PRESCALER, so even the
      scoreboard's readback shadow cannot catch a soft reset that wrongly clobbered
      PRESCALER/CLK_SEL. Nothing verifies that COUNT/FSM/INT_STATUS were cleared either.
      REQ-RST-2 is effectively unverified today.
      RESOLVED, PARTIALLY, 2026-09-18 (test-writer) -- honest split between the two
      halves of this item:
        CHECKING: pmtpc4_soft_reset_vseq/_test does exactly the tests_needed
          scenario: programs PRESCALER=0x1234 and CLK_SEL=1, runs channel 0 (COUNT
          nonzero) and channel 1 to expiry (INT_STATUS nonzero) with a FAST prescaler
          first (a real bug was found and fixed here this session: using the same
          slow 0x1234 prescaler for BOTH the "COUNT nonzero" and "INT_STATUS nonzero"
          preconditions starved channel 1's short one-shot of enough ticks to expire
          within any reasonable cyc() budget), pulses SOFT_RESET, and checks
          COUNT==0 / STATUS.BUSY==0 / INT_STATUS==0 while PRESCALER/CLK_SEL survive
          unchanged; repeats landing the pulse during an in-flight APB ACCESS (forked
          against a raw PRESCALER read) to prove the transfer completes normally
          (also found and fixed: after a soft reset, CH_EN's REGISTER value is NOT
          cleared -- only the FSM's internal state is -- so re-writing the SAME CH_EN
          value produces no rising edge and the channel never restarts; the vseq now
          explicitly toggles CH_EN through 0 first, exactly as real software would).
        COVERAGE: cp_soft_cleared (3 boolean coverpoints: cp_soft_cleared_count/
          _intstat/_fsm, matching the vplan's 3 bin names) added to pmtpc4_coverage.sv,
          classified from READ-SHADOWS of CH0_COUNT/INT_STATUS/STATUS.BUSY (legitimate
          since the vseq deliberately reads all three immediately before the pulse).
          NOT built, honestly: cp_soft_preserved and cp_soft_during -- the former would
          only restate what the directed test's own chk() already asserts (duplicate,
          low-value bookkeeping); the latter needs true bus-phase-overlap detection
          this transaction-level (one-item-at-a-time) subscriber cannot see. Tracked
          as a real, smaller residual, not fabricated as closed.
      [MUTATION-PENDING: seed SOFT_RESET also clobbering PRESCALER and confirm the
      vseq's chk() fires.]
      2026-09-18 (coverage-closure): cp_soft_cleared_fsm.fsm_non_idle was at 0 hits.
      The SCENARIO was already there (the main pulse above lands while channel 0 is in
      LOAD with a 0x1234 prescaler) -- what was missing was the OBSERVATION that supplies
      busy_shadow: cg_reset_soft classifies from a READ of STATUS.BUSY, and every
      STATUS read in the regression happened to be taken while idle (the deliberate
      "vacuous precondition" read at the top of this vseq, and the post-reset
      verification reads). Closed by reading STATUS immediately before the pulse and
      REQUIRING BUSY==1 -- which also makes the precondition a real check rather than an
      assumption: a nonzero COUNT does NOT by itself prove the FSM is non-idle (COUNT is
      retained across a soft-disable, REQ-CORE-5), so STATUS.BUSY is the only black-box
      statement of "the channel core was genuinely running when the soft reset hit".
      cg_reset_soft now 100% (verified standalone on pmtpc4_soft_reset_test).
      cp_soft_preserved / cp_soft_during remain deliberately unbuilt, unchanged -- see
      above.
      2026-09-19 FINDING (F5, design-reviewer + verification-reviewer, independently
      corroborating -- see reports/coverage_waivers.md "Tier 2"): "PRESCALER survives a
      soft reset" had only ever been checked at the REGISTER level (PRESCALER_VAL reads
      back unchanged) -- pmtpc4_prescaler.sv's own internal divider counter (`cnt`, the
      phase) was NOT part of that claim's evidence, and the RTL was in fact zeroing it on
      every soft_reset pulse. REQ-RST-2's exclusion list ("NOT PRESCALER/CLK_SEL/APB FSM")
      groups PRESCALER with the APB FSM's own explicit in-flight-STATE preservation,
      which reads as the whole block's state, phase included -- user-adjudicated this
      exact question 2026-09-19, decision: fix the RTL, not the requirement reading.
      FIXED: pmtpc4_prescaler.sv's soft_reset branch removed entirely; the counter and
      tick_en are now completely unaffected by soft_reset (port still wired at the top
      for interface symmetry, deliberately unused internally). This required reworking
      pmtpc4_freeze_states_vseq.sv's freeze_from_load() task, which had relied on
      SOFT_RESET zeroing the prescaler's phase to reach a deterministic LOAD-state
      window -- reworked to pin the phase via PRESCALER=0 (module enabled) instead,
      which achieves the same determinism without depending on soft_reset. Also added a
      genuinely NEW check to pmtpc4_soft_reset_vseq.sv (this item's own test) that
      directly exercises the previously-unverified phase-preservation claim: puts the
      shared divider at a known mid-phase, pulses soft_reset, starts a fresh channel,
      and confirms the time-to-expiry is consistent with the phase having survived
      (~1300 cycles) rather than been reset to 0 (~2000 cycles) -- a ~700-cycle gap, far
      wider than any APB-latency slop, so the check is robust without needing
      cycle-exact prediction.
    tests: [pmtpc4_full_test, pmtpc4_soft_reset_test, pmtpc4_freeze_states_test]
    status: covered

  - id: VP-SELFCLR
    feature: "Errata 12.5: CTRL.SOFT_RESET and CHx_CTRL.CH_START self-clear within one cycle and are
      never observable as 1 by any subsequent read, including a back-to-back minimum-latency read."
    traces_to: [REQ-RST-2]
    method: directed
    coverage:
      kind: covergroup
      name: cg_reset
      coverpoints:
        cp_selfclr_bit:   { bins: [soft_reset, ch_start_ch0, ch_start_ch1, ch_start_ch2, ch_start_ch3] }
        cp_read_latency:  { bins: [immediate_next_transfer, delayed] }
      cross: [cp_selfclr_bit, cp_read_latency]
    implementation: >
      Coverage can live in pmtpc4_coverage.sv (cg_cfg's sibling) since it is purely
      transaction-level: record a write that set the bit, then classify the next read of the
      same address by how many cycles later it landed. Checker: a dedicated vseq asserting the
      read-back value is 0, since the scoreboard cannot do it (see gap).
    gap: >
      NOT COVERED AND ACTIVELY EXCLUDED FROM CHECKING. pmtpc4_scoreboard.readmask() returns
      0x1 for CTRL (masking off SOFT_RESET bit 1) and 0x16 for CHx_CTRL (masking off CH_START
      bit 3), so those bits are deliberately removed from readback comparison. The RAL models
      both fields as volatile, so uvm_reg_bit_bash_seq does not enforce them either. A field
      that failed to self-clear would be invisible to the entire current regression.
      RESOLVED 2026-09-18 (test-writer), by fixing readmask() itself rather than only
      adding a test, exactly per this item's own gap note: readmask()/selfclear_mask()
      now FOLD the self-clear bits INTO the comparison mask (0x1->0x3 for CTRL,
      0x16->0x1E for CHx_CTRL) and unconditionally force the SHADOW's stored value for
      those bits to 0 regardless of what was written -- so the property is enforced
      by the scoreboard on EVERY subsequent read of these registers for the rest of
      the regression, not just by one dedicated test. pmtpc4_selfclear_vseq/_test
      additionally does the item's literal scenario directly over raw APB (write 1,
      read on the immediately-following transfer, check 0) for both SOFT_RESET and
      CH_START on all four channels. cg_selfclr (cp_selfclr_bit x cp_read_latency,
      matching the vplan's bin names) added to pmtpc4_coverage.sv, transaction-level
      as specified, classifying the next read's latency from $realtime.
      [MUTATION-PENDING: seed CH_START not self-clearing in the RTL and confirm the
      scoreboard's now-enforced mask (not just the dedicated test) catches it.]
      2026-09-18 (coverage-closure): cp_read_latency.immediate_next_transfer was at 0
      hits and x_selfclr at 5/10, and the cause was a COVERAGE-MODEL BUG, not missing
      stimulus -- the bin was UNREACHABLE as written. cp_read_latency measured
      {[0:19]}ns vs {[20:$]}ns, but the latency is taken between two transfers'
      COMPLETION instants (the APB monitor publishes an item on the clock edge that ends
      its ACCESS phase) and an APB3 transfer occupies a MINIMUM of two clocks (SETUP +
      ACCESS) -- so 20ns at 100MHz is the smallest gap any stimulus can produce and
      "< 20ns" was impossible. Boundary corrected to {[0:20]} / {[21:$]} (the intent was
      always "within two clock periods"), AND the genuine minimum-latency observation
      the item's own feature text asks for ("including a back-to-back minimum-latency
      read") was added rather than just relabelling the bin:
      pmtpc4_selfclear_vseq::b2b_write_then_read() issues each self-clearing write and
      its read-back as one APB back-to-back pair over the VIP's opt-in chaining
      (apb_agent_cfg.b2b_enable + pmtpc4_base_vseq::raw_b2b()), with PSEL held across the
      ACCESS->SETUP boundary, for SOFT_RESET and for CH_START on all four channels. That
      is a STRONGER errata-12.5 claim than before: the bit is not observable as 1 even by
      a reader that physically cannot get to the bus any sooner. cg_selfclr now 100%,
      x_selfclr 10/10 (verified standalone on pmtpc4_selfclear_test).
    tests: [pmtpc4_reg_rw_test, pmtpc4_full_test, pmtpc4_selfclear_test]
    status: covered

  - id: VP-MODULE-FREEZE
    feature: "Errata 12.3 / SPEC-FREEZE-1: MODULE_EN=0 FREEZES (does not reset) the channels — state
      and COUNT hold, pwm_out is forced low, STATUS.BUSY=0 — and MODULE_EN=1 resumes from the exact
      frozen state."
    traces_to: [REQ-CORE-8]
    method: directed
    coverage:
      kind: covergroup
      name: cg_cfg
      coverpoints:
        cp_moduleen: { bins: [dis, en] }
    checker: "sva/pmtpc4_channel_sva.sv a_freeze_hold (!module_en |=> $stable(count) && $stable(state),
      every pclk, all 4 instances) + sva/pmtpc4_top_sva.sv a_freeze_pwm_low + pmtpc4_freeze_vseq
      (BUSY==0 while frozen, COUNT stable and non-zero, COUNT advances again after re-enable)"
    evidence: "dv/sv/seq/pmtpc4_channel_vseq.sv::pmtpc4_freeze_vseq; 0 SVA failures"
    tests: [pmtpc4_channel_test, pmtpc4_full_test, pmtpc4_freeze_start_test]
    status: covered
    gap: >
      2026-09-19 FINDING (F4, design-reviewer + verification-reviewer, independently
      corroborating — see reports/coverage_waivers.md "Tier 1 closure"): "MODULE_EN=0 freezes,
      does not reset" was true for state/COUNT but not for an in-flight CH_EN or CH_START
      *transition* — RTL bug: pmtpc4_channel.sv tracked `ch_en_q <= ch_en` unconditionally, so
      a CH_EN 0->1 write (or a CH_START pulse) arriving during a freeze was already "seen" by
      the time the freeze lifted, silently losing the rising edge / the start. The natural
      bring-up order (disable, configure, enable CH_EN, then enable MODULE_EN) left every
      channel stuck in IDLE forever — a severe bug this vplan item's existing coverage/checker
      pair could not have caught, since neither cp_moduleen nor a_freeze_hold looks at CH_EN or
      CH_START at all. FIXED: `ch_en_q` now holds across a freeze (`if (module_en) ch_en_q <=
      ch_en;`); a new sticky `ch_start_pending` register latches CH_START pulses through a
      freeze, consumed at the S_IDLE start_trig branch. New test pmtpc4_freeze_start_vseq/_test
      drives both scenarios and checks the channel actually reaches LOAD/RUNNING after the
      freeze lifts. Fixing this also required updating two INDEPENDENT re-derivations of
      start_trig (pmtpc4_channel_sva.sv and pmtpc4_pwm_cov.sv each keep their own
      ch_en_q_mirror/start_trig_mirror, deliberately not read from the DUT, per the
      spec-independence discipline) — both had gone stale relative to the corrected RTL and
      needed the identical freeze-semantics fix applied independently, re-derived from ports,
      not copied from the DUT's new logic.

  - id: VP-STATUS-AGG
    feature: "STATUS.BUSY = module_en & OR(each channel's busy); STATUS.READY = module_en &
      ~soft_reset_active (SPEC-INT-1, design_spec.md section 7), proven correct for EVERY channel,
      not just channel 0."
    traces_to: [REQ-CORE-8]
    method: assertion
    coverage:
      kind: covergroup
      name: cg_status_busy
      coverpoints:
        cp_sole_busy: { bins: [ch0_only, ch1_only, ch2_only, ch3_only, none, multiple] }
    checker: "sva/pmtpc4_top_sva.sv a_status_busy / a_status_ready — continuous, every pclk,
      re-derived from ch_busy[3:0]/module_en/soft_reset ports independently of pmtpc4.sv's own
      hwif_in.STATUS assignment (these ports ARE that assignment's inputs, bound in specifically
