      session's regression and was fixed to the max-tracking form. pmtpc4_count_value_test
      (new) reads CHx_COUNT over RAL on all 4 channels while running, exercising this bound
      check and directly asserting COUNT<=PERIOD plus "advances between reads" in the vseq
