      re-expires."
    traces_to: [REQ-CORE-2]
    method: directed
    coverage:
      kind: covergroup
      name: cg_cfg
      coverpoints:
        cp_mode: { bins: [oneshot, periodic] }
    checker: "pmtpc4_oneshot_vseq (checks INT_STATUS[0] set AND CH_EN read back 0 after expiry) +
      pmtpc4_periodic_vseq (checks expiry, W1C clear, then RE-expiry) + cg_fsm.cp_trans.exp_idle /
      exp_load, which are the two mode outcomes"
    evidence: "dv/sv/seq/pmtpc4_channel_vseq.sv; cg_fsm 100%"
    tests: [pmtpc4_channel_test, pmtpc4_full_test, pmtpc4_selfclear_race_test]
    status: covered
    gap: >
      2026-09-19 FINDING (F3, design-reviewer + verification-reviewer, independently
      corroborating — see reports/coverage_waivers.md "Tier 1 closure"): the CH_EN hw self-clear
      on one-shot expiry raced against a coincident software write to CH_CTRL and could lose the
      self-clear. Root cause: SystemRDL's field-level `precedence` property defaults to
      `precedence=sw` for a field with both hwclr and sw=rw, and peakrdl-regblock's generated
      logic honored that — a CH_EN write landing on the exact cycle pmtpc4_channel pulses
      ch_en_clr let the sw write win, leaving CH_EN=1 (or whatever value was written) even
      though the channel had already returned to IDLE. Neither pmtpc4_oneshot_vseq (issues no
      write anywhere near the expiry edge) nor cg_fsm's transition bins (state-only, blind to
      the CH_EN register value) could have caught this — this vplan item's own checker was
      derived from the spec's *stated* outcome (CH_EN reads 0 after expiry) but never stimulated
      the one input condition (a same-cycle write) that could violate it. FIXED at the register
      level: `precedence=hw;` added to CH_EN's field declaration in pmtpc4.rdl (regblock
      regenerated, diff-verified to touch only the 4 channels' CH_EN hwclr-vs-sw-write ordering).
      New test pmtpc4_selfclear_race_vseq/_test uses a "spray of writes" technique (b2b-mode
      writes across the whole window of opportunity, since the exact colliding cycle is too
      precise to hit deterministically) to exercise the race and confirm CH_EN self-clears even
      under a contending write.

