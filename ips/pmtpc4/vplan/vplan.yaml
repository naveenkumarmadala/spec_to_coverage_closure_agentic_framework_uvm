  - id: VP-FREEZE-STATES
    feature: "The freeze is proven from EVERY channel state, not only RUNNING: freezing while in LOAD,
      PAUSED or EXPIRED must also hold state exactly and resume correctly (REQ-CORE-8)."
    traces_to: [REQ-CORE-8]
    method: directed
    coverage:
      kind: covergroup
      name: cg_fsm           # extend the existing per-channel bound covergroup
      coverpoints:
        cp_frozen_state: { bins: [idle, load, running, paused, expired] }
    implementation: >
      One coverpoint in cg_fsm: `cp_frozen_state: coverpoint state_o iff (presetn && !module_en)`
      with the five named bins. Zero new plumbing — module_en is already a port of the
      pmtpc4_channel_sva bind.
    gap: >
      PARTIAL. a_freeze_hold is continuous and would catch a violation from ANY state, so the
      CHECK is state-agnostic and strong. What is missing is (a) the coverage point recording
      which states were actually frozen, and (b) stimulus: pmtpc4_freeze_vseq only ever freezes
      channel 0 from RUNNING, so "resume from a frozen EXPIRED completes its expiry, including
      raising its interrupt" (Design 6, explicitly normative) is never exercised.
      PART (a) IMPLEMENTED 2026-09-16: cp_frozen_state added to cg_fsm in
      dv/sv/sva/pmtpc4_channel_sva.sv exactly as specified; regression re-verified 24/24
      green. PART (b) STILL OPEN: no test freezes MODULE_EN from LOAD/PAUSED/EXPIRED, so
      cp_frozen_state's load/paused/expired bins are not expected to be hit by the existing
      regression (only running, and idle via power-on, are exercised) — pmtpc4_freeze_states_test
      below is still needed to close them and is left as `tests_needed`, not fabricated.
      PART (b) RESOLVED 2026-09-18 (test-writer): pmtpc4_freeze_states_vseq/_test drops
      MODULE_EN while channel 1 is in LOAD, channel 2 is in PAUSED, and channel 3 (one-
      shot) / channel 0 (periodic) are in EXPIRED, using a slow PRESCALER to stretch
      each short-lived state into a comfortable multi-cycle window; re-enables and
      checks the pending transition completes, including the periodic case's SECOND
      (deferred) interrupt out of a frozen EXPIRED. Also exercises the CH_PAUSE-during-
      EXPIRED corner this session's earlier mutation pass flagged as unexercised
      (RTL's S_EXPIRED case ignores ch_pause; a pause asserted while EXPIRED must not
      block the EXPIRED->LOAD reload, only take effect once LOAD is reached per errata
      12.1) on channel 1. [MUTATION-PENDING: seed a_freeze_hold's guard to exclude
      EXPIRED and confirm this new stimulus (not just cg_fsm) would have caught the
      resulting hole via a_freeze_hold's own continuous check.]
      PART (b) WAS NOT ACTUALLY CLOSED -- ROOT-CAUSED AND FIXED 2026-09-18
      (coverage-closure). cp_frozen_state.expired read 0 hits on ALL FOUR channels even
      though freeze_from_expired() ran twice and its functional checks passed, and
      `load`/`paused` were missing on the channels the single-channel calls never
      touched (this coverpoint is per-instance: closing a bin on ch0 says nothing about
      ch1-3). Root cause, not a coverage-model problem: both the LOAD and EXPIRED windows
      are exactly ONE tick_en wide and the shared prescaler free-runs at an arbitrary
      phase relative to any APB write, so a fixed cyc(N) guess cannot reach them
      reliably -- and freeze_from_expired() then spent an entire extra APB READ (its
      INT_STATUS precondition check) before issuing the freeze write, so MODULE_EN
      actually dropped ~15 cycles later than the cyc(95) comment assumed, after the
      EXPIRED->IDLE (one-shot) / EXPIRED->LOAD (periodic) tick had already fired. The
      freeze was real and a_freeze_hold/COUNT-stability still passed -- they were just
      describing a freeze taken from IDLE/LOAD.
      Fixes: (1) EXPIRED -- wait_expiry() POLLS INT_STATUS and returns within one APB
      read of the expiry event, so the freeze write is the very next bus transaction
      (~10 cycles) into a 64-cycle window (EXP_PRESC=63); (2) LOAD -- a SOFT_RESET pulse
      zeroes the shared prescaler's own counter immediately before the channel is
      started, so the tick that ends S_LOAD is a KNOWN LOAD_PRESC+1 cycles away;
      (3) all three tasks now run on ALL FOUR channels.
      The fix is verified by EVIDENCE, not by the absence of errors: each freeze now
      makes a DISCRIMINATING check that it really landed in EXPIRED -- one-shot, CH_EN
      must still read 1 during the freeze (it self-clears on the EXPIRED->IDLE tick, so 1
      proves that tick has not happened); periodic, COUNT must still read 0 during the
      freeze (the EXPIRED->LOAD tick reloads it with PERIOD, so 0 proves the reload has
      not happened). Re-generated report on pmtpc4_freeze_states_test alone:
      cp_frozen_state.expired = 77 hits on each of ch0-ch3, load/paused/idle also hit on
      each (running comes from pmtpc4_freeze_vseq in the union run).
    tests: [pmtpc4_channel_test, pmtpc4_full_test, pmtpc4_freeze_states_test]
    status: covered

