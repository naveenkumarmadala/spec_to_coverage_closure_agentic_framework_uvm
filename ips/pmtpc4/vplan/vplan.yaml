    method: assertion
    coverage: { kind: assertion, name: a_pwm_rule }
    checker: "sva/pmtpc4_channel_sva.sv a_pwm_rule (every pclk, all 4 channel instances) +
      sva/pmtpc4_top_sva.sv a_freeze_pwm_low + a_reset_outputs_low"
    evidence: "0 SVA failures across 24/24 seeded runs; a deliberate live-compare-vs-shadow swap was
      caught immediately (112 failures), so the assertion is live and load-bearing"
    limitation: >
      a_pwm_rule reconstructs its expectation from the DUT's OWN compare_shadow register, so it
      is blind to that register latching a wrong VALUE (mutation-proven). It verifies the
      waveform RULE and the shadowing TIMING, not the shadowed value. The residual, previously
      carried by VP-PWM-SHADOW, is now split: VP-PWM-SHADOW-VALUE (a_shadow_latches_input) is
      covered; VP-PWM-SHADOW-DEFER (mid-RUNNING write deferral) remains planned. VP-PWM-DUTY
      (a_duty_matches_cmp) is also implemented, pending its own regression re-verification.
      Do not read this item's `covered` as covering those independently.
    tests: [pmtpc4_full_test, pmtpc4_toggle_test, pmtpc4_channel_test]
    status: covered

  # ======================= Interrupts =======================
  - id: VP-INT-AGG
    feature: "irq = GLOBAL_IE & OR(INT_STATUS & INT_ENABLE); GLOBAL_ISR.GLOBAL_INT_STATUS mirrors the
      same expression as an RO read-back; masking suppresses irq without blocking the raw latch."
    traces_to: [REQ-INT-2, REQ-OUT-2]
    method: assertion
    coverage: { kind: assertion, name: a_irq_aggregation }
    checker: "sva/pmtpc4_top_sva.sv a_irq_aggregation + a_gisr_readback — both continuous, every pclk,
      comparing the DUT outputs against the aggregation expression rebuilt from the register values +
      pmtpc4_irq_vseq directed checks (raw latch while GLOBAL_IE=0; GLOBAL_ISR asserts once enabled)"
    evidence: "0 SVA failures across the regression; cg_cfg.cp_gie {dis,en} and cp_inten
      {none,some,all} prove both mask registers were driven across their range"
    tests: [pmtpc4_irq_test, pmtpc4_full_test]
    status: covered

  - id: VP-INT-MASK-CROSS
    feature: "The full mask state space is exercised: GLOBAL_IE x (any enabled status bit set) x
      (a raw bit latched while masked), including the masked-but-latched corner (REQ-INT-2)."
    traces_to: [REQ-INT-2, REQ-CORE-7]
    method: constrained-random
    coverage:
      kind: covergroup
      name: cg_int
      coverpoints:
        cp_global_ie:          { bins: [0, 1] }
        cp_any_enabled_status: { bins: [0, 1] }
        cp_masked_but_latched: { bins: ["latched_while_masked", "not_masked"] }
        cp_irq:                { bins: [0, 1] }
      cross: [cp_global_ie, cp_any_enabled_status]
    implementation: >
      New dv/sv/env/pmtpc4_int_coverage.sv, OR (preferred) a covergroup added to
      sva/pmtpc4_top_sva.sv sampled @(posedge pclk), which already has global_ie,
      int_status_val, int_en_val, global_int_status and irq as ports — zero new plumbing:
        cp_global_ie          : coverpoint global_ie
        cp_any_enabled_status : coverpoint |(int_status_val & int_en_val)
        cp_masked_but_latched : coverpoint (|int_status_val) && !irq
        x_mask                : cross cp_global_ie, cp_any_enabled_status   // all 4 combos
    gap: >
      PARTIAL. The aggregation EQUATION is strongly checked (VP-INT-AGG, continuous SVA) and
      pmtpc4_irq_vseq directs the masked-latch scenario with an explicit check, so the
      behavior is verified. What is missing is the coverage instrumentation: nothing records
      which mask combinations were actually reached, so a future stimulus regression that
      stopped exercising GLOBAL_IE=0 would be invisible. cg_cfg.cp_gie/cp_inten record only
      the programmed values, uncrossed and unrelated to the status state.
      RESOLVED 2026-09-18 (test-writer): cg_int added to sva/pmtpc4_top_sva.sv exactly as
      specified (cp_global_ie/cp_any_enabled_status/cp_masked_but_latched/cp_irq +
      x_mask), sampled @(posedge pclk) from ports already on the bind (plus ch_expiry,
      added for VP-INT-SIMUL/-SETPRI at the same time). Closed on existing traffic —
      pmtpc4_irq_vseq's masked-latch scenario and GLOBAL_IE 0/1 toggling, plus
      pmtpc4_cov_close_vseq/rand_vseq's GLOBAL_IE sweeps — no new stimulus needed for
      x_mask's 4 cells; confirmed via the coverage report after this session's regression.
      2026-09-19 FINDING (F4-verif, verification-reviewer, mutation-proven -- see
      reports/coverage_waivers.md "Tier 2"): "the aggregation EQUATION is strongly checked"
      (this item's own prior note) is true, but nothing had ever driven a genuinely MIXED
      per-channel INT_ENABLE pattern (some channels masked, others not) WHILE a channel was
      actually expired -- pmtpc4_cov_close_vseq.sv's `INT_ENABLE=4'h7` write happens before
      any channel has expired, so it exercises the register's write path only, not masking's
      functional effect. A per-bit masking bug (e.g. only channel 0's mask bit ever actually
      gating irq, channels 1-3's mask bits ignored) could have slipped through despite
      a_irq_aggregation's strong, independently-derived formula, simply because no test ever
      put the RTL in a state where such a bug would produce a different answer than the
      correct one. RESOLVED: pmtpc4_irq_vseq.sv extended with a fully deterministic,
      per-channel-discriminating scenario -- INT_ENABLE=4'b0101 (ch0,ch2 unmasked; ch1,ch3
      masked), each channel expired one at a time, checking irq/GLOBAL_ISR after EACH: masked
      channels raw-latch but never move irq; the first UNMASKED expiry (ch0) is what actually
      flips it; clearing only the unmasked channels' bits (leaving the still-set masked bits
      alone) drops irq back to 0 -- proving a masked-but-set bit never drives irq by itself,
      not merely that "some channel is enabled".
    tests: [pmtpc4_irq_test, pmtpc4_full_test, pmtpc4_rand_test]
    status: covered

  - id: VP-INT-W1C
    feature: "INT_STATUS[n] latches on channel n expiry independent of masking; W1C semantics —
      write-1 clears, write-0 has no effect; reset value 0 (REQ-INT-1, REQ-CORE-7)."
    traces_to: [REQ-INT-1, REQ-CORE-7]
    method: directed
    coverage:
      kind: covergroup
      name: cg_int
      coverpoints:
        cp_bit: { bins: "each of [0..3]" }
        cp_op:  { bins: [set_by_hw, clr_by_w1, hold_on_w0, already_set_set_again] }
      cross: [cp_bit, cp_op]
    implementation: >
      In the new pmtpc4_int_coverage / top-SVA covergroup, sample per bit on each observed
      event: set_by_hw on a 0->1 edge of int_status_val[n] (which can only come from the
      channel expiry pulse), clr_by_w1 on an APB write of 1 to INT_STATUS[n] that clears it,
      hold_on_w0 on an APB write of 0 to INT_STATUS[n] with the bit set and still set after.
      Requires joining the APB write stream with the register state — simplest as a covergroup
      in pmtpc4_top_sva.sv sampled on the int_status_val edges plus an `hwif` write strobe.
      Checker: extend pmtpc4_scoreboard to model INT_STATUS (today readmask() returns -1 for
      0x60, so INT_STATUS reads are never predicted at all) with W1C + hw-set semantics.
    gap: >
      NOT COVERED AND WEAKLY CHECKED. W1C is exercised (pmtpc4_periodic_vseq writes 1 to clear
      then confirms re-expiry; pmtpc4_irq_vseq clears all four) but write-0-has-no-effect is
      never exercised by any test, per-bit set/clear has no coverage, and the scoreboard
      explicitly skips INT_STATUS readback prediction.
      RESOLVED 2026-09-18 (test-writer), CHECKING VIA A DIFFERENT ROUTE than the
      implementation text proposed: extending the scoreboard to a full W1C predictor
      was assessed and rejected as infeasible -- the scoreboard is transaction-level
      only (sees completed APB items, no pclk/tick_en visibility), and hw can SET
      INT_STATUS bits at any time independent of any write, so a write-history-only
      shadow cannot distinguish "hw set it after my write" from "my write failed to
      clear it" without cycle-level knowledge it doesn't have. Instead:
      pmtpc4_int_w1c_vseq/_test checks every one of the item's own literal scenarios
      directly (self-checking against explicit expected values, the same style as the
      existing oneshot/softdisable vseqs): per bit n, hw-set after expiry, write-0-
      holds (never exercised before), write-1-clears, plus a multi-bit write. Coverage:
      cg_int_bit (one instance per channel bit, option.per_instance stands in for the
      cp_bit x cp_op cross) added to sva/pmtpc4_top_sva.sv, classifying
      set_by_hw/clr_by_w1/hold_on_w0/already_set_set_again from int_status_val edges +
      ch_expiry + the regblock's cpuif write strobe (added as new ports on the bind).
      [MUTATION-PENDING: seed W1C write-0 wrongly clearing the bit and confirm
      pmtpc4_int_w1c_vseq's chk() fires.]
    tests: [pmtpc4_irq_test, pmtpc4_channel_test, pmtpc4_full_test, pmtpc4_int_w1c_test]
    status: covered

  - id: VP-INT-SIMUL
    feature: "Simultaneous expiry of 2, 3 or 4 channels on the identical prescaled tick sets all their
