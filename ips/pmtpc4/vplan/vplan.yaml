      {state_o, pwm} coverpoint. Pair with assertion
      a_pwm_stable_in_paused: (state_o==S_PAUSED && module_en) |=> $stable(pwm).
    gap: >
      UPDATED 2026-09-17 (verification-reviewer, was stale): cg_pwm's cp_pwm_by_state now
      DOES exercise and observe this — paused_high=13, paused_low=40 hits confirmed in
      pmtpc4_full_test after VP-PWM-DUTY's implementation (pmtpc4_pwm_duty_vseq runs PWM_EN=1
      through a PAUSED transition). The coverage bins are hit. What's still missing is the
      DIRECT checker: a_pwm_stable_in_paused (state_o==S_PAUSED && module_en |=> $stable(pwm))
