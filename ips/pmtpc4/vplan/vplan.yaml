      correct and the antecedent was genuinely created thousands of times — see
      report_phase's `opportunities` counter, added specifically because a correct
      design makes the primary `checks` counter looks vacuously 0).
      [MUTATION-PENDING: seed a stuck-PWM_EN-gate bypass at pwm_out and confirm
      pmtpc4_pwm_blackbox_checker fires.]
    tests: [pmtpc4_full_test, pmtpc4_toggle_test, pmtpc4_pwm_all_channels_test]
