  - id: VP-PWM-SHADOW-DEFER
    feature: "Design 7.4: a PERIOD or COMPARE write while the channel is RUNNING takes effect only at
      the NEXT LOAD, never immediately — the in-flight count/waveform is not corrupted."
    traces_to: [REQ-CORE-3, REQ-CORE-1]
    method: assertion
    coverage:
      kind: covergroup
      name: cg_pwm
      coverpoints:
        cp_cmp_write_timing: { bins: [no_write_this_period, write_midrun_effect_deferred] }
        cp_per_write_timing: { bins: [no_write_this_period, write_midrun_effect_deferred] }
      cross: [cp_cmp_write_timing, cp_duty_class]
    implementation: >
      In pmtpc4_pwm_cov: a sticky `cmp_written_midrun` set when the `compare` input changes
      while state_o inside {S_RUN, S_PAUSED}, cleared at LOAD entry, sampled at the period
      close. Checker:
        a_shadow_holds_midrun : (state_o inside {S_RUN,S_PAUSED}) |=> $stable(compare_shadow)
      Use the existing always_ff mirroring idiom in pmtpc4_channel_sva.sv rather than $past
      on bound-module ports (documented xsim preponed-region X issue).
    gap: >
      Split out of VP-PWM-SHADOW 2026-09-17 — see VP-PWM-SHADOW-VALUE for the latched-VALUE
      half, which is closed. NOT COVERED here: a_shadow_holds_midrun and
      cp_cmp_write_timing/cp_per_write_timing don't exist yet, and the 2026-09-17 mutation
      probe (see VP-PWM-SHADOW-VALUE's gap note) confirmed this scenario is barely stimulated
      today — only 6 failure events from one assertion caught a deleted periodic-reload
      re-latch, because pmtpc4_pwm_duty_vseq always drops CH_EN and re-enters via the IDLE
      path rather than changing COMPARE mid-RUNNING on an already-periodic channel.
      RESOLVED 2026-09-18 (test-writer). a_shadow_holds_midrun added to
      dv/sv/sva/pmtpc4_channel_sva.sv: (state_prev inside {S_RUN,S_PAUSED}) |->
      $stable(cshadow_prev), using the file's existing one-cycle-delayed local mirrors
      (never the bare compare_shadow port). Under today's correct RTL this is true by
      construction (nothing in RUN/PAUSED ever touches compare_shadow), which is why
      it needed deliberate mid-run writes to be a non-vacuous exercise, not why it is
      wrong to assert. cp_cmp_write_timing/cp_per_write_timing (+ x_cmp_write_duty
      cross vs cp_duty_class) added to pmtpc4_pwm_cov.sv's cg_pwm, sampled at period
      close. pmtpc4_pwm_shadow_vseq/_test creates the missing scenario directly: starts
      a periodic channel, writes COMPARE (then, separately, PERIOD) mid-RUNNING, and
      lets several periods elapse. [MUTATION-PENDING: seed compare_shadow updating
      immediately on a mid-RUN write and confirm a_shadow_holds_midrun fires.]
      2026-09-18 (coverage-closure): x_cmp_write_duty finished at 6/10 on ALL FOUR
      channels -- the mid-run write only ever landed on a channel loaded with
      0 < COMPARE < PERIOD, so (write_midrun_effect_deferred x
      {period_zero, compare_zero, compare_eq_period, compare_gt_period}) were all 0.
      Design 7.4's deferral rule is not specific to one duty class, so those four are
      real gaps, not impossibilities. Closed with
      pmtpc4_pwm_shadow_vseq::compare_write_while_paused(): the channel is started with
      CH_EN|CH_PAUSE together so errata 12.1 parks it in PAUSED (where
      cp_cmp_write_timing also keys), the COMPARE write is issued there -- which makes
      landing inside the window DETERMINISTIC rather than racing the period, and is the
