  - id: VP-CH-COUNT-READBACK
    feature: "CHx_COUNT read over the APB/RAL interface returns the register's live value
      (not merely that the internal count net loads/decrements correctly, which
      VP-CH-COUNT-VALUE's SVA layer now proves)."
    traces_to: [REQ-CORE-1]
    method: test
    coverage: { kind: scoreboard, name: pmtpc4_scoreboard.readmask CH_COUNT }
    implementation: >
      Extend pmtpc4_scoreboard.sv's readmask() to stop returning -1 for CH_COUNT (currently
      skips prediction entirely) and predict the expected readback value, or at minimum
      bound-check a read against the last-written PERIOD and elapsed ticks.
    gap: >
      Split out of VP-CH-COUNT-VALUE 2026-09-17 (verification-reviewer): the SVA layer now
      proves count's internal VALUE is correct (see that item), but no test reads CHx_COUNT
      back over the RAL/APB and compares it — the scoreboard-level readback path itself is
      still unverified (readmask() returns -1 for CH_COUNT). Do not fold this back into
      VP-CH-COUNT-VALUE; it is a materially different check (bus readback path vs. internal
      register value) and conflating them is what let this residual hide the first time.
      RESOLVED 2026-09-18 (test-writer) as a BOUND-CHECK, not a full value predictor (the
      vplan's own "at minimum" alternative): pmtpc4_scoreboard.sv now tracks the MAX
      CHx_PERIOD value ever written per channel (last_period[]) and, on every CHx_COUNT
      read (readmask() still returns -1 for it, unchanged — this check is separate from
      the static readback-shadow mechanism), fails if the read value exceeds that bound.
