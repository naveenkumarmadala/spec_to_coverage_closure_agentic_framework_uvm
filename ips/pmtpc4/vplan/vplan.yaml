    traces_to: [REQ-INT-3]
    method: directed
    coverage:
      kind: covergroup
      name: cg_int
      coverpoints:
        cp_n_simultaneous: { bins: [one, two, three, four] }
    implementation: >
      coverpoint $countones(expiry_bus) sampled @(posedge pclk) iff (|expiry_bus), where
      expiry_bus is the 4-bit per-channel expiry pulse vector already available inside
      pmtpc4 (add it as a port on the pmtpc4_top_sva bind).
    gap: >
      PARTIAL. pmtpc4_irq_vseq programs all four channels with the same PERIOD and checks that
      INT_STATUS reads 0xF, so the FOUR-channel case is exercised and checked. The two- and
      three-channel cases are never exercised, and there is no coverage instrumentation at all,
      so nothing records how many channels actually coincided on a tick (the four-channel
      alignment is also assumed rather than measured).
      RESOLVED 2026-09-18 (test-writer): cp_n_simultaneous added to cg_int in
      sva/pmtpc4_top_sva.sv, sampled from the ch_expiry port (added at the same time
      as VP-INT-SETPRI needed it) iff |ch_expiry. pmtpc4_int_simultaneous_vseq/_test
      aligns 2, then 3, then 4 channels using a PRESCALER set large relative to the
      few cycles of APB write latency needed to start N channels, so every channel is
      well into LOAD before the shared next tick_en fires -- they transition
      LOAD->RUNNING on that SAME tick and (identical PERIOD) decrement/expire in
      lockstep. The vseq checks the resulting register state (exactly the expected
      bits set); whether the expiry pulses actually coincided on one cycle is what
      cp_n_simultaneous (sampled by the SVA, not this vseq) measures.
