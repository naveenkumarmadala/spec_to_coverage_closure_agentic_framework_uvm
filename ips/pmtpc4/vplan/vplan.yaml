      a_pwm_matches_independent (pmtpc4_pwm_cov.sv) tracking pwm_exp_local, which itself goes
      stable when ch_active/count go stable in PAUSED, not via a property that states the
      PAUSED-hold invariant directly. Add the direct assertion to close this properly rather
      than relying on the indirect implication.
      RESOLVED 2026-09-18 (test-writer): a_pwm_stable_in_paused added to
      dv/sv/sva/pmtpc4_pwm_cov.sv exactly as specified (state==PAUSED && module_en implies
      pwm stable), built on a one-cycle-delayed local mirror of state_o per this file's
      established bare-port-safety idiom. Stimulus already existed (pmtpc4_pwm_duty_vseq);
      no new test needed. [MUTATION-PENDING: seed a PAUSED-state pwm re-evaluation and
      confirm a_pwm_stable_in_paused fires.]
      ANTECEDENT CORRECTED 2026-09-18 (coverage-closure) -- found by NEW STIMULUS, not by
      inspection. The assertion needed TWO consecutive PAUSED cycles, not one. Every test
      that existed when it was written entered PAUSED from RUNNING; VP-PWM-SHADOW-DEFER's
      new compare_write_while_paused() enters PAUSED straight from LOAD (errata 12.1,
      CH_EN|CH_PAUSE written together) and produced exactly one failure per channel (4
      total) on known-good RTL. Cause: `pwm` is pwm_q, registered one cycle behind
      pwm_level, and S_LOAD lasts exactly one cycle -- so the FIRST PAUSED cycle still
      carries the value computed while the FSM was in S_IDLE (ch_active=0 => low), and it
      settles to the level implied by the frozen COUNT on the second. This is the SAME
      one-cycle registration artifact already accepted for cp_pwm_by_state.load_high
      (illegal_bins, 2026-09-17), not a Design 7.3 violation: the invariant is about the
      level being HELD, and the level is not established until pwm_q has had its cycle.
      Requiring two consecutive PAUSED cycles states that precisely and costs no
      sensitivity -- any pwm change during a sustained PAUSED still fires, which is the
      mutation class the assertion exists for. Recorded in reports/coverage_waivers.md
      under "Checker robustness corrections".
    tests: [pmtpc4_full_test, pmtpc4_toggle_test, pmtpc4_pwm_duty_test]
    status: covered

