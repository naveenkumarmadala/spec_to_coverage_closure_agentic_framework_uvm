    tests: [pmtpc4_toggle_test, pmtpc4_full_test, pmtpc4_channel_test, pmtpc4_pwm_shadow_test]
    status: covered

  - id: VP-PWM-BLACKBOX
    feature: "One independently-driven pwm_out per channel observed at the TB boundary (REQ-OUT-1):
      four separate outputs, no cross-talk, forced low during MODULE_EN=0 freeze."
    traces_to: [REQ-OUT-1]
    method: assertion
    coverage:
      kind: covergroup
      name: cg_pwm_out
      coverpoints:
        cp_pin:       { bins: "each of [0..3]" }
        cp_level:     { bins: [low, high] }
        cp_activity:  { bins: [toggling, held_low, held_high] }
      cross: [cp_pin, cp_level]
    implementation: >
      New passive monitor dv/sv/env/pmtpc4_pwm_monitor.sv driven from a pwm_if (or directly
      from pmtpc4_tb_top's pwm_out wire via uvm_config_db), publishing per-pin transitions on
      an analysis port; cg_pwm_out subscribes. This is the vip/pwm UVC that ip_config.yaml
      already flags as needed (provenance.needs_confirmation: "vip/pwm ... status: planned").
      Checker: a per-pin reference model fed from the RAL mirror of CHx_PERIOD/CHx_COMPARE/
      CHx_CTRL — i.e. predicting pwm_out from what SOFTWARE WROTE, the one perspective the
      current white-box SVA cannot provide.
    gap: >
      NOT COVERED (until 2026-09-18). dv/sv/tb/pmtpc4_tb_top.sv declares `logic [3:0]
      pwm_out` and connects it to the DUT, but NOTHING in the UVM environment
      subscribed to it — there was no pwm monitor, no pwm interface, no coverage, and
      no black-box check on any of the four outputs. Every PWM statement was proven
      only by white-box assertions bound inside the channel.
      RESOLVED IN TWO STEPS 2026-09-18. tb-architect built the vip/pwm UVC (pwm_if +
      passive monitor + pwm_item) and pmtpc4_pwm_coverage (cg_pwm_out) — coverage/
      observation plumbing only, deliberately left the CHECKER unbuilt for test-writer.
      test-writer then added pmtpc4_pwm_blackbox_checker.sv: a per-pin reference model
      fed ONLY from the RAL mirror of CTRL.MODULE_EN / CHx_CTRL.PWM_EN/CH_EN (never a
      DUT-internal signal) and env.pwm_agt.mon.ap's pwm_item RISE-edge stream. SCOPE,
      stated honestly rather than overclaimed: it checks the GATING invariant --
      whenever software's own config says a pin must be forced low (MODULE_EN off,
      this channel's PWM_EN off, or CH_EN off/IDLE), the black-box pin never goes HIGH
      again once that config has had time (a 30ns/3-cycle grace, timestamped from the
      same apb_item stream the scoreboard already observes) to propagate. It does
      NOT check the COMPARE>=PERIOD "always low" case black-box (that is subject to
