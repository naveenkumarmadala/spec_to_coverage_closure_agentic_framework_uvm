      SPEC-INT-1's formula directly (not copied from pmtpc4.sv's own comment). Being continuous,
      this retroactively validates every test in the regression that already exercises channels
      1-3 (pmtpc4_pwm_all_channels_test, pmtpc4_freeze_states_test, etc.) without needing new
